name: Publicar landing Te Equipamos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validar estándar Te Equipamos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import html as html_lib

          html_path = Path('index.html')
          manifest_path = Path('te-equipamos.json')

          if not html_path.exists():
              raise SystemExit('Falta index.html')
          if not manifest_path.exists():
              raise SystemExit('Falta te-equipamos.json')

          html = html_path.read_text(encoding='utf-8')
          required = [
              'class="te-header"',
              'class="brand"',
              'data-te-whatsapp',
              'name="te:product"',
              'name="te:price"',
              'https://jorgesport.github.io/te-equipamos/landing-shell.css',
              'https://jorgesport.github.io/te-equipamos/landing-core.js',
              'https://jorgesport.github.io/te-equipamos/te-analytics-provider.js',
              'data-te-universal-footer-loader'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Faltan elementos del sistema Te Equipamos: ' + ', '.join(missing))

          if 'REEMPLAZAR_' in html:
              raise SystemExit('Quedan marcadores REEMPLAZAR_ en index.html')

          # Si alguien añade enlaces directos a WhatsApp, solo se permite el número oficial.
          # Los enlaces de compartir del Hub no forman parte de esta validación de la landing.
          direct_wa = re.findall(r"https://wa\.me/([^?\"'\s<]+)", html, flags=re.I)
          bad_wa = [value for value in direct_wa if value not in ('51920807184', '')]
          if bad_wa:
              raise SystemExit('Se detectó un número de WhatsApp distinto al oficial: ' + ', '.join(bad_wa))

          data = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          if data.get('brand') != 'Te Equipamos':
              raise SystemExit('El manifiesto debe mantener brand = Te Equipamos')
          items = data.get('items')
          if not isinstance(items, list) or not items:
              raise SystemExit('El manifiesto necesita al menos un item')
          raw = json.dumps(data, ensure_ascii=False)
          if 'REEMPLAZAR_' in raw:
              raise SystemExit('Quedan marcadores REEMPLAZAR_ en te-equipamos.json')
          item = items[0]
          if not str(item.get('url','')).startswith('https://jorgesport.github.io/'):
              raise SystemExit('La URL pública del manifiesto no es válida')

          # SEO social obligatorio: Hub y redes deben compartir la misma estrategia editorial.
          def meta_content(kind, key):
              pattern = rf'<meta\\s+{kind}=["\\\']{re.escape(key)}["\\\'][^>]*content=["\\\']([^"\\\']*)["\\\'][^>]*>'
              match = re.search(pattern, html, flags=re.I)
              return html_lib.unescape(match.group(1)).strip() if match else ''

          social_expected = {
              ('property', 'og:title'): str(item.get('card_title') or '').strip(),
              ('property', 'og:description'): str(item.get('summary') or '').strip(),
              ('property', 'og:image'): str(item.get('image') or '').strip(),
              ('property', 'og:url'): str(item.get('url') or '').strip(),
              ('name', 'twitter:title'): str(item.get('card_title') or '').strip(),
              ('name', 'twitter:description'): str(item.get('summary') or '').strip(),
              ('name', 'twitter:image'): str(item.get('image') or '').strip(),
          }
          for (kind, key), expected in social_expected.items():
              if not expected:
                  raise SystemExit(f'Falta valor obligatorio para SEO social: {key}')
              actual = meta_content(kind, key)
              if actual != expected:
                  raise SystemExit(f'{key} no coincide con la estrategia del Hub')

          if meta_content('property', 'og:site_name') != 'Te Equipamos':
              raise SystemExit('og:site_name debe ser Te Equipamos')
          if meta_content('property', 'og:locale') != 'es_PE':
              raise SystemExit('og:locale debe ser es_PE')
          if meta_content('name', 'twitter:card') != 'summary_large_image':
              raise SystemExit('twitter:card debe ser summary_large_image')
          if not meta_content('property', 'og:image:alt'):
              raise SystemExit('Falta og:image:alt')
          if not meta_content('name', 'twitter:image:alt'):
              raise SystemExit('Falta twitter:image:alt')

          print('Estándar Te Equipamos + SEO social: OK')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
