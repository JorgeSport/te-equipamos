name: Mantener footer universal Te Equipamos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Asegurar loader del footer universal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gh-pages/news/index.html')
          tag = '<script defer src="https://jorgesport.github.io/te-equipamos/universal-footer.js" data-te-universal-footer-loader></script>'
          if not path.exists():
              raise SystemExit('No existe gh-pages/news/index.html')
          html = path.read_text(encoding='utf-8')
          if 'data-te-universal-footer-loader' not in html:
              if '</body>' not in html:
                  raise SystemExit('No se encontró </body>')
              html = html.replace('</body>', tag + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY
      - name: Guardar solo si hubo cambios
        run: |
          if git diff --quiet; then
            echo "Footer universal ya presente"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-pages/news/index.html
          git commit -m "Aplicar footer universal de Te Equipamos"
          git push
