name: Publicar Te Equipamos Hub en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar todo el contenido propio desde GitHub
        run: python gh-pages/news/sync-github-content.py

      - name: Crear lectores para contenidos de otros repositorios
        run: python gh-pages/news/wrap-external-content.py

      - name: Cargar contenido Te Equipamos en el diseño actual
        run: python gh-pages/news/apply-real-news.py

      - name: Configurar menús de Ventas Reviews Vídeos Consejos Ofertas y Novedades
        run: python gh-pages/news/configure-owned-portal.py

      - name: Activar etiquetas y temas con color estratégico
        run: python gh-pages/news/enhance-tags.py

      - name: Instalar prueba visual de banners propios
        run: python gh-pages/news/install-promos.py

      - name: Añadir cierres estratégicos entre secciones
        run: python gh-pages/news/add-section-journeys.py

      - name: Preparar tarjetas para compartir con imagen y enlace
        run: python gh-pages/news/add-sharing.py

      - name: Abrir directamente las landings marcadas como directas
        run: python gh-pages/news/enhance-product-cards.py

      - name: Mejorar búsqueda filtros vistos recientemente y guardados
        run: python gh-pages/news/enhance-discovery.py

      - name: Añadir breadcrumbs a las fichas
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, quote
          import html as h
          import json
          root = Path('gh-pages')
          items = json.loads(Path('gh-pages/news/news-data.json').read_text(encoding='utf-8'))
          preferred = ['Reviews','Ventas','Consejos','Ofertas','Novedades','Vídeos']
          css = '<style id="teBreadcrumbCss">.te-breadcrumbbar{font-family:Arial,Helvetica,sans-serif;background:#fff;border-bottom:1px solid #e5e7eb;color:#5f6368}.te-breadcrumbbar-wrap{max-width:1120px;margin:auto;min-height:42px;padding:0 18px;display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;overflow:hidden}.te-breadcrumbbar a{color:#1a73e8;text-decoration:none;font-weight:700}.te-breadcrumbbar strong{color:#3c4043;overflow:hidden;text-overflow:ellipsis}.te-breadcrumbbar span{color:#9aa0a6}@media(max-width:720px){.te-breadcrumbbar-wrap{min-height:40px;padding:0 14px;font-size:11px}}@media(prefers-color-scheme:dark){.te-breadcrumbbar{background:#111315;border-color:#303134;color:#aeb3b8}.te-breadcrumbbar strong{color:#e8eaed}}</style>'
          count = 0
          for item in items:
              u = urlparse(str(item.get('url') or ''))
              prefix = '/te-equipamos-arpenaz-27l/'
              if u.netloc.lower() != 'jorgesport.github.io' or not u.path.startswith(prefix):
                  continue
              rel = u.path[len(prefix):].strip('/')
              page = root / 'index.html' if not rel else root / rel / 'index.html'
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              if 'class="te-breadcrumbbar"' in text:
                  continue
              sections = item.get('sections') or []
              section = next((s for s in preferred if s in sections), sections[0] if sections else '')
              mid = ''
              if section:
                  mid = f'<a href="/te-equipamos-arpenaz-27l/news/?section={quote(section)}">{h.escape(section)}</a><span>›</span>'
              bar = f'<nav class="te-breadcrumbbar" aria-label="Ruta de navegación"><div class="te-breadcrumbbar-wrap"><a href="/te-equipamos-arpenaz-27l/news/">Te Equipamos</a><span>›</span>{mid}<strong>{h.escape(str(item.get("title") or "Contenido"))}</strong></div></nav>'
              if '</head>' in text:
                  text = text.replace('</head>', css + '</head>', 1)
              body = text.find('<body')
              if body >= 0:
                  end = text.find('>', body)
                  if end >= 0:
                      text = text[:end+1] + bar + text[end+1:]
                      page.write_text(text, encoding='utf-8')
                      count += 1
          print(f'Breadcrumbs añadidos a {count} fichas.')
          PY

      - name: Añadir recomendaciones estratégicas a las landings
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('gh-pages')
          css = '<link rel="stylesheet" href="/te-equipamos-arpenaz-27l/related-content.css">'
          js = '<script src="/te-equipamos-arpenaz-27l/related-content.js"></script>'
          skip = {'news', 'studio', 'kalenji'}
          count = 0
          for page in root.rglob('index.html'):
              rel = page.relative_to(root)
              if rel.parts and rel.parts[0] in skip:
                  continue
              html = page.read_text(encoding='utf-8')
              changed = False
              if css not in html and '</head>' in html:
                  html = html.replace('</head>', css + '</head>', 1)
                  changed = True
              if js not in html and '</body>' in html:
                  html = html.replace('</body>', js + '</body>', 1)
                  changed = True
              if changed:
                  page.write_text(html, encoding='utf-8')
                  count += 1
          print(f'Recomendaciones instaladas en {count} páginas propias.')
          PY

      - name: Activar vencimiento automático de la promoción
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('gh-pages/escape-500-rolltop/index.html')
          html = target.read_text(encoding='utf-8')
          tag = '<script src="../auto-expiry.js"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '</body>', 1)
              target.write_text(html, encoding='utf-8')
          PY

      - name: Ajustar Raincut a la única variante en oferta
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('gh-pages/quechua-raincut-mujer/index.html')
          html = target.read_text(encoding='utf-8')
          old = '''<section class="section colors"><div class="wrap"><div class="eyebrow">DOS COLORES OFICIALES</div><h2>Elige cómo quieres llevarla.</h2><p class="lead">La ficha oficial muestra versiones verde y blanca. Aquí se presentan completas, sin recortar la prenda.</p><div class="colorGrid"><article class="colorCard"><img src="https://contents.mediadecathlon.com/p2644113/k$0f087bd94641b37d5774f3863062e386/picture.jpg?f=1600x0&format=auto" alt="Quechua Raincut mujer verde"><b>Verde</b><span>Variante protagonista · Ref. 8785339 - 12</span></article><article class="colorCard"><img src="https://contents.mediadecathlon.com/p1059037/k$69f79b3e4bbc2acb99ae1be1abb2bcf2/picture.jpg?f=1600x0&format=auto" alt="Quechua Raincut mujer blanca"><b>Blanco</b><span>Variante oficial</span></article></div></div></section>'''
          new = '''<section class="section colors"><div class="wrap"><div class="eyebrow">VARIANTE EN OFERTA</div><h2>Esta es la Raincut disponible.</h2><p class="lead">La promoción de Te Equipamos corresponde únicamente a la variante verde, Ref. 8785339 - 12.</p><div class="colorGrid" style="grid-template-columns:minmax(0,720px);justify-content:center"><article class="colorCard"><img src="https://contents.mediadecathlon.com/p2644113/k$0f087bd94641b37d5774f3863062e386/picture.jpg?f=1600x0&format=auto" alt="Quechua Raincut mujer verde en oferta"><b>Verde</b><span>Única variante incluida en esta oferta · Ref. 8785339 - 12</span></article></div></div></section>'''
          html = html.replace(old, new)
          html = html.replace('Puedes consultar talla, color, disponibilidad o realizar tu compra directamente por WhatsApp.', 'Puedes consultar talla y disponibilidad de la variante verde o realizar tu compra directamente por WhatsApp.')
          html = html.replace('Quisiera%20informaci%C3%B3n%20sobre%20talla%2C%20color%20y%20disponibilidad.', 'Quisiera%20informaci%C3%B3n%20sobre%20talla%20y%20disponibilidad%20de%20la%20variante%20verde.')
          target.write_text(html, encoding='utf-8')
          PY

      - name: Evitar huecos blancos si falla una miniatura
        run: python gh-pages/news/fix-card-image-gaps.py

      - name: Pulir experiencia editorial de escritorio
        run: python gh-pages/news/polish-desktop-layout.py

      - name: Adaptar actividades a responsive y cerrar identidad
        run: python gh-pages/news/finalize-portal.py

      - name: Control de calidad antes de publicar
        run: python gh-pages/news/quality-check.py

      - name: Evitar versiones antiguas en caché
        run: python gh-pages/news/cache-policy.py

      - name: Redirigir las páginas migradas a sus repositorios independientes
        run: python migration/create-redirects.py

      - name: Preparar SEO medición monetización y Media Kit
        run: python gh-pages/news/business-ready.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages
      - id: deployment
        uses: actions/deploy-pages@v4
